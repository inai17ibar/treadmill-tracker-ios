name: TreadmillTracker
options:
  developmentLanguage: en
  bundleIdPrefix: com.inai17ibar
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: KMY26YJWL2
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  TreadmillKit:
    type: framework
    platform: iOS
    sources:
      - path: Sources/TreadmillKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inai17ibar.TreadmillKit
        GENERATE_INFOPLIST_FILE: true
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "2"
  TreadmillTracker:
    type: application
    platform: iOS
    sources:
      - path: Sources/TreadmillTracker
      - path: Sources/Shared
    dependencies:
      - target: TreadmillKit
      - sdk: HealthKit.framework
      - sdk: CoreMotion.framework
      - sdk: WatchConnectivity.framework
      - target: TreadmillWatch
        embed: true
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: トレッドミル
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [ja, en]
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "2"
        NSHealthShareUsageDescription: 消費カロリーの計算に使う体重と身長、および履歴の復元に使うこのアプリのワークアウト・距離・アクティブエネルギーを読み込みます。
        NSHealthUpdateUsageDescription: トレッドミルでのウォーキング・ランニングを、距離と消費カロリーとともにヘルスケアに保存します。
        NSMotionUsageDescription: ワークアウト中の歩数とピッチ（1 分あたりの歩数）を計測します。
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Support/TreadmillTracker.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inai17ibar.TreadmillTracker
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TreadmillWatchKit:
    type: framework
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Sources/TreadmillKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inai17ibar.TreadmillWatchKit
        PRODUCT_MODULE_NAME: TreadmillKit
        PRODUCT_NAME: TreadmillKit
        GENERATE_INFOPLIST_FILE: true
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "2"
  TreadmillWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Sources/TreadmillWatch
      - path: Sources/Shared
    dependencies:
      - target: TreadmillWatchKit
      - sdk: HealthKit.framework
      - sdk: WatchConnectivity.framework
    info:
      path: Support/Watch-Info.plist
      properties:
        CFBundleDisplayName: Treadmill
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [ja, en]
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "2"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.inai17ibar.TreadmillTracker
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: Read heart rate during indoor workouts to guide your effort and record workout metrics.
        NSHealthUpdateUsageDescription: Save indoor workouts, distance and active energy to Apple Health.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Support/TreadmillWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inai17ibar.TreadmillTracker.watchkitapp
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
  AppStoreScreenshots:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/AppStoreScreenshots
    dependencies:
      - target: TreadmillTracker
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
schemes:
  TreadmillWatch:
    build:
      targets:
        TreadmillWatch: all
    run:
      config: Debug
  TreadmillTracker:
    build:
      targets:
        TreadmillTracker: all
    run:
      config: Debug
    archive:
      config: Release
  AppStoreScreenshots:
    build:
      targets:
        TreadmillTracker: all
        AppStoreScreenshots: [test]
    test:
      config: Debug
      targets:
        - AppStoreScreenshots
